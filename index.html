<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 span {
      color: #ff0033;
    }

    p {
      color: #aaa;
      margin-bottom: 35px;
    }

    .download-box {
      display: flex;
      background: #181818;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid #2b2b2b;
    }

    input {
      flex: 1;
      padding: 17px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 0 25px;
      border-radius: 10px;
      background: #ff0033;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #d9002b;
    }

    #result {
      margin-top: 30px;
      display: none;
      background: #181818;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #2b2b2b;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .warning {
      font-size: 12px;
      color: #666;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .download-box {
        flex-direction: column;
      }

      button {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1><span>YT</span> Downloader</h1>

  <p>Paste a YouTube video link below</p>

  <div class="download-box">
    <input
      type="text"
      id="videoURL"
      placeholder="https://youtube.com/watch?v=..."
    >

    <button onclick="loadVideo()">Continue</button>
  </div>

  <div id="result">
    <iframe
      id="player"
      allowfullscreen>
    </iframe>

    <p>
      Only download videos that you own or have permission to download.
    </p>
  </div>

  <div class="warning">
    This website does not bypass YouTube's download restrictions.
  </div>

</div>

<script>

function getVideoID(url) {

  try {
    const parsedURL = new URL(url);

    if (parsedURL.hostname.includes("youtu.be")) {
      return parsedURL.pathname.substring(1);
    }

    if (parsedURL.hostname.includes("youtube.com")) {

      if (parsedURL.pathname === "/watch") {
        return parsedURL.searchParams.get("v");
      }

      if (parsedURL.pathname.startsWith("/shorts/")) {
        return parsedURL.pathname.split("/")[2];
      }

    }

  } catch (error) {
    return null;
  }

  return null;
}


function loadVideo() {

  const url = document.getElementById("videoURL").value.trim();

  const videoID = getVideoID(url);

  if (!videoID) {
    alert("Enter a valid YouTube link.");
    return;
  }

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + videoID;

  document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
